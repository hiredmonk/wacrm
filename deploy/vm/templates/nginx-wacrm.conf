# wacrm vhost, managed by deploy/vm/install.sh. Plain HTTP; certbot adds
# the TLS server block and the redirect to it in place.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    # Chat media uploads are capped at 16 MB by the app; Meta webhook
    # bodies at 4 MB.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_wacrm;
        proxy_read_timeout 60s;
    }

    # Cron routes are driven from the box itself (wacrm-cron.timer), never
    # from the internet.
    location ~ ^/api/(automations|flows)/cron {
        return 404;
    }
}

map $http_upgrade $connection_upgrade_wacrm {
    default upgrade;
    ''      close;
}
